<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />

</head>
<body>
    <div class="container">
        
        <!--sidebar section -->
        <div class="side-bar">

            <div class="logo">Baber </div>

            <div class="sidebar-menu">
                <div class="dashboard"><i class="fa-solid fa-table-cells"></i>Dashboard</div>
                <div class="dashboard"><i class="fa-solid fa-user"></i>Custember</div>
                <div class="dashboard"><i class="fa-solid fa-chart-line"></i>analytices</div>
                <div class="dashboard"><i class="fa-regular fa-message"></i>Message <span class="span">14</span></div>
                <div class="dashboard"><i class="fa-regular fa-paste"></i>Products</div>
                <div class="dashboard"><i class="fa-solid fa-triangle-exclamation"></i>Reports</div>
                <div class="dashboard"><i class="fa-solid fa-gear"></i>Setting</div>
                <div class="dashboard"><i class="fa-solid fa-plus"></i>Add Products</div>
                <div class="dashboard"><i class="fa-solid fa-right-from-bracket"></i>Logout</div>
            </div>

        </div> <!--sidebar section END -->
        

        <!--main section -->
        <div class="main-section">

            <h1 class="main-section-h1">DashBoard</h1>

            <div class="date-container">
                <p>mm/dd/yyyy <i class="fa-regular fa-calendar-days"></i></p>
            </div>

            <div class="father-container">
                <div class="child-container child1">
                    <div class="main-icon icon1"><i class="fa-solid fa-arrow-trend-up"></i></div>
                    <p class="text" >Total Sales</p>
                    <div class="bauwa-container">
                        <h1 class="h1">$25,024</h1>
                        <div></div>
                    </div>
                    <p class="p">Last 24 Hours</p>
                </div>
                <div class="child-container child2">
                    <div class="main-icon icon2"><i class="fa-solid fa-bag-shopping"></i></i></div>
                    <p class="text" >Total Sales</p>
                    <div class="bauwa-container">
                        <h1 class="h1">$25,024</h1>
                        <div></div>
                    </div>
                    <p class="p">Last 24 Hours</p>
                </div>

                <div class="child-container child3">
                    <div class="main-icon icon3"><i class="fa-solid fa-arrow-trend-up"></i></div>
                    <p class="text" >Total Sales</p>
                    <div class="bauwa-container">
                        <h1 class="h1">$25,024</h1>
                    </div>
                    <p class="p">Last 24 Hours</p>
                </div>
            </div>
            <div class="table-container">
                <h1 class="recent-text">Recent Order</h1>
                <div class="table-mini-container"></div>
            </div>
        </div> <!--main section END -->
        


        <!--right bar section -->
        <div class="right-section">
            <h1>right section</h1>
        </div> <!--right bar section END -->
        
    </div>
</body>
</html>
