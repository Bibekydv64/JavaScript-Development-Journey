<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini exercise</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="input">
        <input class="input1" type="text" placeholder="Enter a Character" required>
    </div>

    <div class="container container1">
        <label>Uppercase</label> <br>
        <span></span>
    </div>

    <div class="container container2">
        <label>Lowercase</label><br>
        <span> </span>
    </div>

    <div class="container container3">
        <label>Capitalize</label><br>
        <span ></span>
    </div>

    <div class="container container4">
        <label>Pascal</label><br>
        <span></span>
    </div>

    <div class="container container5">
        <label>CamelCase</label><br>
        <span></span>
    </div>


    <script src="index.js"></script>
</body>
</html>
