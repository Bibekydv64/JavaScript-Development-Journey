<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            height: 100vh;
        }

        .container{
            height: 50vh;
            width: 400px;
            background-color: rgb(73, 75, 78);
            box-shadow: 5px 5px 4px rgb(20, 82, 104);
            display: flex;
            flex-direction: column;
            /* justify-content: center; */
            /* padding-left: 20px; */
            border-radius: 10px;
        }
        .img{
            width: 100px;
            border-radius: 50%;
            margin-left: 155px;

        }
        .text-name{
            /* margin-top: 10px; */
            color: whitesmoke;
            font-weight: bolder;
            font-size: 1.6rem;
            text-align: center;
        }
        .text-skill{
            /* margin-top: 10px; */
            color: blue;
            font-size: 1.4rem;
            text-align: center;
        }
        .text-age{
            /* margin-top: 20px; */
            font-size: 1.2rem;
            color: whitesmoke;
            text-align: center;
        }
        .para{
            color: whitesmoke;
            text-align: center;
        }

        .input{
            display: block;
            margin-top: 30px;
            height: 40px;
            width: 300px;
            border: none;
            border-radius: 11px;
            box-shadow: 5px 0px 10px skyblue;
        }
        .nothing{
            margin: 100px 100px;
        }

    </style>
</head>
<body>
    <div class="nothing">
        <h1 style="color: whitesmoke;">Submit profile Detials</h1>
        <form>
            <input  class="input" type="text" placeholder="Enter profile addresss" required>
            <input class="input"   type="text" placeholder="Enter name" required>
            <input class="input"   type="text" placeholder="Skill" required>
            <input class="input"   type="text" placeholder="Enter Age" required>
            <input class="input"   type="text" placeholder="Enter some info text" required> 
            <button type="submit" class="input">Submit</button>
        </form>
    </div>
    <script src="js-dom-events.js"></script>
</body>
</html>
